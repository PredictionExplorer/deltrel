[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deltreltrain"
version = "0.3.0"
description = "PyTorch training foundation for Double Deltrel"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0.2",
  "torch>=2.13",
]

[project.scripts]
deltreltrain-selfplay = "deltreltrain.cli:selfplay_main"
deltreltrain-train = "deltreltrain.cli:train_main"
deltreltrain-actor = "deltreltrain.cli:actor_main"
deltreltrain-orchestrate = "deltreltrain.orchestration:orchestrate_main"
deltreltrain-preflight = "deltreltrain.preflight:preflight_main"
deltreltrain-arena = "deltreltrain.cli:arena_main"
deltreltrain-distill = "deltreltrain.distill:distill_main"
deltreltrain-publish-browser = "deltreltrain.publish:publish_browser_main"
deltreltrain-promote = "deltreltrain.promotion:promotion_main"
deltrelserve = "deltrelserve.cli:main"

[project.optional-dependencies]
serve = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]
test = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "hypothesis>=6.156.5",
  "maturin>=1.14.1",
  "mutmut>=3.6.0",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript>=0.4",
  "pip-audit>=2.10.1",
  "pyright>=1.1.411",
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "ruff",
]
onnx = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.4"]

[tool.hatch.build]
exclude = [
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/dist",
  "/runs",
  "/target",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["deltreltrain", "deltrelserve"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --strict-config --strict-markers"
testpaths = ["tests"]
timeout = 60
xfail_strict = true
filterwarnings = [
  "error::DeprecationWarning:deltreltrain.*",
  "error::DeprecationWarning:deltrelserve.*",
  'ignore:Using `httpx` with `starlette.testclient` is deprecated.*',
  'ignore:`isinstance\(treespec, LeafSpec\)` is deprecated.*:FutureWarning',
  "ignore:# The axis name.*will not be used.*:UserWarning",
]
markers = [
  "native: requires the compiled deltrel_native extension",
  "cuda: requires one CUDA-capable GPU",
  "multi_gpu: requires at least two CUDA-capable GPUs",
  "soak: long-running target-host reliability validation",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.coverage.run]
branch = true
source = ["deltreltrain", "deltrelserve"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true

[tool.pyright]
include = ["deltreltrain", "deltrelserve", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.mutmut]
source_paths = ["deltreltrain"]
only_mutate = [
  "deltreltrain/arena.py",
  "deltreltrain/losses.py",
  "deltreltrain/replay.py",
  "deltreltrain/selfplay.py",
]
mutate_only_covered_lines = true
also_copy = ["configs"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = [
  "tests/test_arena.py",
  "tests/test_losses.py",
  "tests/test_pipeline_core.py",
  "tests/test_replay.py",
]
