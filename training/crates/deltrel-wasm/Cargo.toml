[package]
name = "deltrel-wasm"
description = "WASM bindings for the Double Deltrel engine and search primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
deltrel-engine = { path = "../deltrel-engine" }
deltrel-search = { path = "../deltrel-search" }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

