schema_version: 2
experiment_config: h100.yaml
model_manifest: ../runs/h100-8gpu/learner/champion.json
device: cuda:0
host: 0.0.0.0
port: 8080
rules_schema_id: deltrel.rules.v3
rules_hash: fnv1a64:46e4fbcff4e17fd3
feature_schema_id: deltrel.model-features.external.v3
